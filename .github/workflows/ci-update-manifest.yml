name: Update Manifest

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      image_tag:
        required: true
        type: string

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GIT_TOKEN }}
          ref: ${{ github.ref_name }}

      - name: Update image tag in helm values
        run: |
          sed -i "s|tag:.*|tag: ${{ inputs.image_tag }}|g" helm/skillpulse/values-${{ inputs.environment }}.yaml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/skillpulse/values-${{ inputs.environment }}.yaml
          git commit -m "deploy: update ${{ inputs.environment }} image to ${{ inputs.image_tag }}" || echo "No changes to commit"
          git push
