name: dockerfile scan

on:
    workflow_call:

jobs:
    docker-lint:
        runs-on: ubuntu-latest
        
        steps:

        - name: code checkout
          uses: actions/checkout@v4

        - name: scan dockerfile using hadolint
          uses: hadolint/hadolint-action@v3.1.0
          with:
            dockerfile: "**/Dockerfile"
            recursive: true