# Default values for skillpulse
# These are overridden by values-dev/stg/prd.yaml

environment: dev

backend:
  image:
    repository: rahulthakkar555/skillpulse-app-backend
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 1
  port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      memory: 128Mi

frontend:
  image:
    repository: rahulthakkar555/skillpulse-app-frontend
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 1
  port: 80
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      memory: 64Mi

mysql:
  image: mysql:8.4
  rootPassword: rootpassword123
  database: skillpulse
  user: skillpulse
  password: skillpulse123
  storage: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

service:
  frontend:
    type: NodePort
    nodePort: 30080
  backend:
    type: ClusterIP
